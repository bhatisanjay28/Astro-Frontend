<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-labelledby="wordmark-title">
  <!--
    PLACEHOLDER WORDMARK (docs/placeholders.md P1) — original dummy mark, owner
    supplies the final logo later. Single swappable file. Colours via CSS vars
    (inlined by Wordmark.astro) so it adapts to light/dark themes.
  -->
  <title id="wordmark-title">Vyotish — placeholder wordmark</title>
  <g fill="none">
    <!-- star symbol: eight-pointed Vedic star -->
    <g stroke="var(--color-secondary-light)" stroke-width="2">
      <path d="M28 6 L32 20 L46 24 L32 28 L28 42 L24 28 L10 24 L24 20 Z" fill="var(--color-primary)" stroke="none" opacity="0.92"/>
      <circle cx="28" cy="24" r="18" stroke-opacity="0.55"/>
      <circle cx="28" cy="24" r="23" stroke-opacity="0.25"/>
    </g>
    <!-- wordmark -->
    <text x="62" y="34" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" letter-spacing="1.5" fill="var(--color-text)">Vyotish</text>
    <text x="63" y="48" font-family="Inter, system-ui, sans-serif" font-size="9" letter-spacing="4" fill="var(--color-text-muted)">VEDIC ASTROLOGY</text>
  </g>
</svg>
